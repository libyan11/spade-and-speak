<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5A3ED8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spade &amp; Speak">
<title>Spade &amp; Speak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lilita+One&display=swap">
<style>
/* Layout: ring board on the left, turn panel on the right; every turn plays on a full-screen card stage */
:root {
  --bg: #E7E9F4;
  --surface: #FFFFFF;
  --plate: #FFFFFF;
  --ink: #1F1B3F;
  --muted: #5F5B80;
  --line: #D2D4E6;
  --shadow: rgba(31, 27, 63, .35);
  --accent: #5A3ED8;
  --accent-deep: #3E28A6;
  --on-accent: #FFFFFF;
  --good: #1E9B5A;
  --good-deep: #157443;
  --bad: #D9363E;
  --finish: #1F1B3F;
  --stage: #1F1B3F;
  --stage-2: #2B2655;
  --stage-fg: #FFFFFF;
  --stage-muted: #B9B4DD;
  --stage-line: rgba(255, 255, 255, .16);
  --card: #FFFFFF;
  --card-ink: #1F1B3F;
  --spade-badge: #1F1B3F;
  --c-object: #2F6FED;
  --c-action: #EF7D1A;
  --c-world: #E9B520;
  --c-person: #E2414B;
  --c-random: #8B4CC4;
  --c-nature: #22A069;
  --f-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14122B; --surface: #1F1C3E; --plate: #1F1C3E; --ink: #F1EFFF; --muted: #ABA6CF;
    --line: #322E5C; --shadow: rgba(0, 0, 0, .6); --accent: #8F78FF; --accent-deep: #5A3ED8; --on-accent: #120F2A;
    --finish: #F1EFFF; --stage: #0D0B20; --stage-2: #1B1840; --stage-muted: #A39ECB; --spade-badge: #1F1B3F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14122B; --surface: #1F1C3E; --plate: #1F1C3E; --ink: #F1EFFF; --muted: #ABA6CF;
  --line: #322E5C; --shadow: rgba(0, 0, 0, .6); --accent: #8F78FF; --accent-deep: #5A3ED8; --on-accent: #120F2A;
  --finish: #F1EFFF; --stage: #0D0B20; --stage-2: #1B1840; --stage-muted: #A39ECB; --spade-badge: #1F1B3F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.locked { overflow: hidden; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .005em; }
p { margin: 0; }
#app { max-width: 1180px; margin: 0 auto; padding-block: 14px 48px; }

.cat-object { --cat: var(--c-object); --cat-fg: #fff; }
.cat-action { --cat: var(--c-action); --cat-fg: #fff; }
.cat-world  { --cat: var(--c-world);  --cat-fg: #2B2104; }
.cat-person { --cat: var(--c-person); --cat-fg: #fff; }
.cat-random { --cat: var(--c-random); --cat-fg: #fff; }
.cat-nature { --cat: var(--c-nature); --cat-fg: #fff; }
.cat-any    { --cat: linear-gradient(100deg, var(--c-object), var(--c-action), var(--c-world), var(--c-person), var(--c-random), var(--c-nature)); --cat-fg: #fff; }
.cat-any b, .cat-any span { text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--cat); color: var(--cat-fg); font-weight: 800; border-radius: 999px; padding: .2em .8em; font-size: .9rem; letter-spacing: .02em; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; font-weight: 800; color: var(--muted); }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 2px 18px; }
.brand { display: flex; align-items: center; gap: 12px; font-family: var(--f-display); font-size: 1.65rem; }
.brand-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 1.35rem; transform: rotate(-8deg); }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Buttons */
.btn {
  font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: .65em 1.1em; cursor: pointer;
  background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line);
  transition: transform .12s, filter .12s, opacity .12s; touch-action: manipulation;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(2px) scale(.985); }
.btn:focus-visible, input:focus-visible, .rv:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-deep); }
.btn-lg { font-size: 1.15rem; padding: .85em 1.4em; }
.btn-go { background: var(--good); color: #fff; box-shadow: 0 5px 0 var(--good-deep); }
.btn-ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
.btn-small { font-size: .9rem; padding: .5em .9em; }

/* Setup */
.setup-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.setup-form { display: flex; flex-direction: column; gap: 22px; }
.setup-form h1 { font-size: clamp(2.2rem, 5vw, 3.3rem); }
.setup-form .lede { color: var(--muted); max-width: 46ch; }
.field { display: flex; flex-direction: column; gap: 8px; }
.label { font-weight: 800; font-size: .95rem; }
.seg-group { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-group button { font: inherit; font-weight: 700; border: 0; cursor: pointer; padding: .55em 1em; border-radius: 12px; background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); min-width: 48px; }
.seg-group button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.seg-group button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.teams { display: flex; flex-direction: column; gap: 10px; }
.team-row { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.25fr); gap: 8px; align-items: center; }
.swatch { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; box-shadow: 0 0 0 3px var(--surface), 0 0 0 4.5px var(--line); }
input[type="text"] { font: inherit; padding: .62em .8em; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
input::placeholder { color: var(--muted); opacity: .8; }
.resume { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: inset 0 0 0 1.5px var(--accent); }
.setup-board { display: flex; flex-direction: column; gap: 16px; }

/* Board */
.board-wrap { position: relative; width: 100%; max-width: 560px; margin-inline: auto; aspect-ratio: 1; }
.board-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.plate { fill: var(--plate); }
.board-shadow { fill: var(--shadow); opacity: .25; }
.seg { stroke: var(--plate); stroke-width: 1.4; }
.seg-object { fill: var(--c-object); } .seg-action { fill: var(--c-action); } .seg-world { fill: var(--c-world); }
.seg-person { fill: var(--c-person); } .seg-random { fill: var(--c-random); } .seg-nature { fill: var(--c-nature); }
.seg-finish { fill: var(--finish); }
.seg-lbl.lbl-any { paint-order: stroke; stroke: rgba(0, 0, 0, .45); stroke-width: 2px; }
.spade circle { fill: var(--spade-badge); stroke: #fff; stroke-width: 1.2; }
.spade text { fill: #fff; font-size: 11px; font-family: var(--f-body); }
.fin-glyph { fill: var(--plate); font-size: 11px; }
.seg-lbl { font-family: var(--f-body); font-weight: 800; fill: #fff; pointer-events: none; }
.seg-lbl.lbl-world { fill: #2B2104; }
.seg-lbl.lbl-finish { fill: var(--plate); }
.divider { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.ring-label { fill: var(--muted); font-family: var(--f-body); font-weight: 800; font-size: 8.5px; letter-spacing: 1.3px; }
.tok { transition: transform .26s cubic-bezier(.3, 1.5, .5, 1); }
.tok .body { stroke: #fff; stroke-width: 2.2; }
.tok .halo { fill: none; stroke: var(--ink); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
.tok.active .halo { animation: halo 1.5s ease-out infinite; }
.tok-t { fill: #fff; font-family: var(--f-body); font-weight: 800; pointer-events: none; }
@keyframes halo { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
.board-center { position: absolute; inset: 28%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; }
.bc-team { font-family: var(--f-display); font-size: clamp(1.05rem, 3.2vw, 1.6rem); line-height: 1.05; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
.bc-sub { color: var(--muted); font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--plate), 0 0 0 3.5px var(--line); }
.legend { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; justify-content: center; }
.legend li { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.legend .pill { font-size: .8rem; }
.legend .spade-key { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--spade-badge); color: #fff; font-size: .8rem; }
.legend .spin-key { width: 22px; height: 22px; display: block; }

/* Game */
.game { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 32px; align-items: start; }
.board-col { display: flex; flex-direction: column; gap: 16px; }
.panel { display: flex; flex-direction: column; gap: 16px; }
.turn-card { background: var(--surface); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 var(--line), 0 18px 34px -24px var(--shadow); }
.turn-card h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); display: flex; align-items: center; gap: 10px; }
.turn-card .dot { width: 18px; height: 18px; }
.cat-block { background: var(--cat); color: var(--cat-fg); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.cat-block b { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; line-height: 1.1; }
.cat-block span { font-size: .9rem; opacity: .9; font-weight: 600; }
.final-block { border-radius: 16px; padding: 14px 16px; background: var(--ink); color: var(--bg); }
.final-block b { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; display: block; }
.muted { color: var(--muted); }
.race { background: var(--surface); border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 0 var(--line); }
.race h3 { font-size: 1.2rem; }
.race-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.race-name { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; }
.race-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.race-row.is-cur .race-name { color: var(--accent); }
.race-pos { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; font-weight: 700; }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s; }
.last { font-size: .92rem; color: var(--muted); padding-inline: 4px; }

/* Stage */
#stage {
  position: fixed; inset: 0; z-index: 50; background: radial-gradient(120% 80% at 50% 0%, var(--stage-2), var(--stage) 70%); color: var(--stage-fg);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
}
.stage-inner { width: 100%; max-width: 640px; margin: auto; display: flex; flex-direction: column; gap: 18px; }
.stage-inner h2 { font-size: clamp(2rem, 6vw, 3rem); }
.stage-inner .eyebrow { color: var(--stage-muted); }
.stage-inner .sub { color: var(--stage-muted); font-size: 1.05rem; }
.rules-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.rules-list li { background: var(--stage-line); border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: .95rem; display: flex; gap: 8px; align-items: baseline; }
.rules-list li::before { content: "✕"; color: #FF8A8F; font-weight: 800; }
.house { border-radius: 14px; padding: 12px 14px; box-shadow: inset 0 0 0 1.5px var(--stage-line); font-size: .95rem; }
.house b { color: #FFD66B; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .grow { flex: 1 1 200px; }

.play-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer { position: relative; width: 92px; height: 92px; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .track { fill: none; stroke: var(--stage-line); stroke-width: 8; }
.timer .prog { fill: none; stroke: #FFD66B; stroke-width: 8; stroke-linecap: round; }
.timer.low .prog { stroke: #FF5A63; }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 2.2rem; font-variant-numeric: tabular-nums; }
.timer.low span { color: #FF8A8F; animation: thump 1s infinite; }
@keyframes thump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } }
.tally { text-align: right; }
.tally b { font-family: var(--f-display); font-weight: 400; font-size: 2.4rem; line-height: 1; display: block; font-variant-numeric: tabular-nums; }
.tally span { color: var(--stage-muted); font-size: .85rem; font-weight: 700; }

.card-stack { position: relative; }
.card-stack::before { content: ""; position: absolute; inset: 8px -6px -8px 6px; border-radius: 24px; background: var(--card); opacity: .18; transform: rotate(2.5deg); }
.card { position: relative; background: var(--card); color: var(--card-ink); border-radius: 24px; overflow: hidden; box-shadow: 0 24px 50px -20px rgba(0, 0, 0, .7); animation: deal .3s cubic-bezier(.2, .9, .3, 1.25); }
.card-band { background: var(--cat); color: var(--cat-fg); padding: 10px 18px; display: flex; justify-content: space-between; gap: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; }
.card-word { min-height: 210px; display: grid; place-items: center; text-align: center; padding: 26px 20px; font-family: var(--f-display); font-size: clamp(2.3rem, 9vw, 4.3rem); line-height: 1.02; text-wrap: balance; overflow-wrap: anywhere; }
.card.paused .card-word { color: var(--muted); font-size: 2rem; }
@keyframes deal { from { transform: translateX(46px) rotate(5deg); opacity: 0; } to { transform: none; opacity: 1; } }
.parked { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-radius: 14px; padding: 10px 12px 10px 14px; background: var(--stage-line); min-height: 52px; }
.parked b { color: #FFD66B; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 620px; margin: 6px auto 4px; text-align: left; }
.award { background: var(--stage-line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.award .aw-ic { font-size: 1.35rem; line-height: 1; }
.award b { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: #FFD66B; }
.award .aw-who { font-weight: 800; font-size: 1.02rem; overflow-wrap: anywhere; }
.award small { opacity: .8; font-size: .82rem; }
.play-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; }
.play-actions .btn { font-size: 1.25rem; padding: .95em .6em; }
.btn-skip { background: transparent; color: var(--stage-fg); box-shadow: inset 0 0 0 2px var(--stage-fg); }
.play-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.link { font: inherit; background: none; border: 0; color: var(--stage-muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 2px; font-weight: 600; }
.link:focus-visible { outline: 3px solid #FFD66B; outline-offset: 2px; border-radius: 6px; }
.kbd-hint { color: var(--stage-muted); font-size: .8rem; }

.review-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.rv { width: 100%; font: inherit; text-align: left; cursor: pointer; border: 0; border-radius: 14px; padding: 10px 12px; background: var(--stage-line); color: var(--stage-fg); display: flex; flex-direction: column; gap: 2px; }
.rv-word { font-weight: 800; font-size: 1.05rem; }
.rv-tag { font-size: .8rem; color: var(--stage-muted); font-weight: 700; }
.rv.ok { background: var(--good); }
.rv.ok .rv-tag { color: #D5F7E4; }
.move-line { font-size: 1.15rem; }
.move-line b { font-family: var(--f-display); font-weight: 400; font-size: 2rem; color: #FFD66B; }

.spade-big { width: 86px; height: 86px; border-radius: 26px; background: var(--stage-fg); color: var(--stage); display: grid; place-items: center; font-size: 3.2rem; transform: rotate(-8deg); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.cat-btn { background: var(--cat); color: var(--cat-fg); box-shadow: 0 4px 0 rgba(0, 0, 0, .3); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 16px; text-align: left; }
.cat-btn b { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; }
.cat-btn span { font-size: .85rem; font-weight: 600; opacity: .9; }
.win-name { font-size: clamp(2.8rem, 11vw, 5.4rem) !important; color: var(--team); text-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.wheel-wrap { position: relative; width: min(280px, 72vw); aspect-ratio: 1; margin-inline: auto; }
.wheel-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.wheel-pin { fill: #FFD66B; stroke: var(--stage); stroke-width: 3; stroke-linejoin: round; }
.wheel-lbl { font-family: var(--f-display); font-size: 24px; fill: #fff; }
.spin-result { text-align: center; font-family: var(--f-display); font-size: clamp(3rem, 14vw, 5rem); line-height: 1; color: #FFD66B; }
.spin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.spin-btn { background: var(--team); color: #fff; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; }
.spin-btn span { font-size: .85rem; font-weight: 600; opacity: .92; }
.btn-foul { background: #D9363E; color: #fff; box-shadow: 0 4px 0 #9E1F26; }
.btn-fair { background: var(--good); color: #fff; box-shadow: 0 4px 0 var(--good-deep); }
.rv-item { display: flex; flex-direction: column; gap: 6px; }
.rv.flag { box-shadow: inset 0 0 0 2px #FF5A63; }
.rv-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rv-actions .btn { font-size: .8rem; padding: .4em .7em; border-radius: 10px; }
.vote-box { border-radius: 18px; padding: 16px; background: var(--stage-line); display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 0 0 2px #FF5A63; }
.vote-box h3 { font-size: 1.4rem; }
.vote-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

function posLabel(p) { return p === 0 ? 'the start' : p === S.len - 1 ? 'the finish' : 'space ' + p; }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
/* end-of-game awards, worked out from the log of turns */
function awardsHTML(log, teams) {

  log.forEach(e => {

    if (e.f) fouls[nm(e)] = (fouls[nm(e)] || 0) + e.f;
    if (!e.n) zeros[nm(e)] = (zeros[nm(e)] || 0) + 1;

  if (star && star[1] > 0) cards.push(['🗣️', 'Star describer', star[0], `${plural(star[1], 'word')} described`]);
  const best = log.reduce((a, e) => e.n > a.n ? e : a, log[0]);
  if (best.n > 0) cards.push(['⚡', 'Best turn', nm(best), `${best.n} right in one turn`]);
  const ti = teamWords.indexOf(Math.max(...teamWords));
  cards.push(['📚', 'Most words', teams[ti].name, `${plural(teamWords[ti], 'word')} all game`]);
  const fm = top(fouls);

/* ---------- timer ---------- */
const tm = { raf: 0, end: 0, onEnd: null, lastSec: null };

}

/* ---------- game flow ---------- */
function newTurn(mode, cat) {

  return { mode, cat, card: null, parked: null, skipUsed: false, records: [], left: TURN_SECONDS, paused: false };
}

function startGame() {
  readDraftInputs();
  const teams = draft.teams.slice(0, draft.count).map((t, i) => ({
    name: (t.name || '').trim() || `Team ${i + 1}`, color: TEAM_COLORS[i],
    players: (t.players || '').split(',').map(s => s.trim()).filter(Boolean), pos: 0, desc: 0

  S = { phase: 'idle', len: draft.len, words: MODES[draft.words] ? draft.words : 'normal', spaces: buildSpaces(draft.len), teams, cur: 0, decks: {}, turn: null, spade: null, spinner: null, vote: null, last: null, after: null, winner: null, log: [] };

const RES_LABEL = { correct: 'Got it', skipped: 'Skipped', foul: 'Said the word', timeout: 'Time ran out' };

const ACT = {
  count(b) { readDraftInputs(); draft.count = +b.dataset.n; store(DRAFT_KEY, draft); renderSetup(); },
  len(b) { readDraftInputs(); draft.len = +b.dataset.n; store(DRAFT_KEY, draft); renderSetup(); },
  words(b) { readDraftInputs(); draft.words = b.dataset.mode; store(DRAFT_KEY, draft); renderSetup(); },
  start: startGame,
  resume() { S = saved; saved = null; normalize(); boardKey = ''; render(); },
  discard() { store(SAVE_KEY, null); saved = null; renderSetup(); },
  rules: openRules,
  closeRules,
  sound() { muted = !muted; ensureAudio(); $('#soundBtn').textContent = muted ? 'Sound off' : 'Sound on'; },
  newgame(b) {
    if (b.dataset.armed) {

      b.textContent = 'New game'; delete b.dataset.armed; render(); return;
    }

  },
  startTurn() {

      <button class="btn btn-primary btn-lg" data-act="startTurn" ${moving ? 'disabled' : ''}>${moving ? 'Moving…' : atFinish ? 'Start final challenge' : 'Start turn'}</button>
    </div>
    <div class="race">
      <h3>The race</h3>
      ${S.teams.map((tm2, i) => `
        <div class="race-row ${i === S.cur ? 'is-cur' : ''}">
          <div class="race-name"><span class="dot" style="background:${tm2.color}"></span><span>${esc(tm2.name)}</span></div>
          <div class="race-pos">${tm2.pos === S.len - 1 ? 'Finish' : tm2.pos === 0 ? 'Start' : tm2.pos + ' / ' + (S.len - 1)}</div>
          <div class="bar"><i style="width:${(tm2.pos / (S.len - 1)) * 100}%;background:${tm2.color}"></i></div>
        </div>`).join('')}
    </div>
    ${S.last ? `<p class="last">${esc(S.last)}</p>` : ''}`;
}

/* spinner wheel: eases onto the chosen slice; timed from sp.at so a reload lands it straight away */
const wa = { id: null, start: 0, final: 0, iv: 0, tick: 0 };
function wheelSVG() {
  const n = SPIN_VALUES.length, step = 360 / n, pt = (r, d) => [r * Math.cos(d * Math.PI / 180), r * Math.sin(d * Math.PI / 180)];
  let s = '';
  SPIN_VALUES.forEach((val, k) => {
    const a0 = -90 + k * step, a1 = a0 + step, mid = a0 + step / 2;
    const [x1, y1] = pt(100, a0), [x2, y2] = pt(100, a1), [tx, ty] = pt(68, mid);
    const fill = val > 0 ? (k % 4 < 2 ? '#1E9B5A' : '#27B66D') : (k % 4 < 2 ? '#D9363E' : '#EA545B');
    s += `<path d="M0 0L${f1(x1)} ${f1(y1)}A100 100 0 0 1 ${f1(x2)} ${f1(y2)}Z" fill="${fill}" stroke="#fff" stroke-width="2"/>`;
    s += `<text class="wheel-lbl" text-anchor="middle" dy=".35em" transform="translate(${f1(tx)} ${f1(ty)}) rotate(${f1(mid + 90)})">${val > 0 ? '+' : '−'}${Math.abs(val)}</text>`;
  });
  return `<div class="wheel-wrap"><svg viewBox="-112 -120 224 232" aria-hidden="true"><g id="wheel">${s}<circle r="100" fill="none" stroke="#fff" stroke-width="5"/><circle r="15" fill="#fff"/></g><path class="wheel-pin" d="M-13 -117L13 -117L0 -88Z"/></svg></div>`;
}
function wheelAngle() { const t = Math.min(1, (performance.now() - wa.start) / SPIN_MS); return wa.final * (1 - Math.pow(1 - t, 3)); }
function wheelDone(sp) { return sp.result != null && Date.now() - sp.at >= SPIN_MS; }
function paintWheel(a) { const g = document.getElementById('wheel'); if (g) g.setAttribute('transform', `rotate(${f1(a)})`); }
function driveWheel(sp) {
  if (sp.result == null) { paintWheel(0); return; }
  if (wa.id !== sp.at) {
    clearInterval(wa.iv); wa.iv = 0;
    const step = 360 / SPIN_VALUES.length;
    Object.assign(wa, { id: sp.at, start: performance.now() - (Date.now() - sp.at), final: 360 * 6 - (sp.slice * step + step / 2), tick: 0 });
    if (!wheelDone(sp)) wa.iv = setInterval(() => {
      const a = wheelAngle(); paintWheel(a);
      const tk = Math.floor(a / step);
      if (tk !== wa.tick) { wa.tick = tk; sfx.step(); }
      if (wheelDone(sp)) { clearInterval(wa.iv); wa.iv = 0; sfx.ok(); renderStage(); }
    }, 16);
  }
  paintWheel(wheelAngle());
}

const STAGE = {
  ready() {
    const t = S.teams[S.cur], who = describer(S.cur), tr = S.turn, fin = tr.mode === 'final';
    return `<div class="stage-inner">
      <p class="eyebrow">${esc(t.name)}${fin ? ' · final challenge' : ''}</p>
      <h2>Pass the device to ${who ? esc(who) : 'your describer'}</h2>
      <p class="sub">${fin ? `Get 1 card right in 30 seconds and you win the game.` : 'Only the describer looks at the screen. Teammates, get ready to shout.'}</p>
      <div><span class="pill cat-${tr.cat}" style="font-size:1.05rem">${CAT[tr.cat]} · ${HINT[tr.cat]}</span></div>
      <ul class="rules-list">
        <li>Saying the word or part of it</li><li>"Sounds like" or rhymes</li>
        <li>First letters or spelling</li><li>Other languages</li><li>Acting, miming or pointing</li>
      </ul>
      <p class="house"><b>1 skip this turn.</b> The skipped card waits on the side. You can go back to it any time this turn, even after getting others right.</p>
      <p class="house"><b>Other teams, watch the screen.</b> Shout "Foul!" if the describer says the word or part of it. You can also challenge any card after the turn.</p>
      <div class="row">
        <button class="btn btn-ghost btn-lg" data-act="cancelReady">Back</button>
        <button class="btn btn-go btn-lg grow" data-act="go">Start 30 seconds</button>
      </div>
    </div>`;
  },
  play() {
    const tr = S.turn, fin = tr.mode === 'final', got = tr.records.filter(r => r.ok).length;
    const cc = tr.card && tr.card.cat || tr.cat;
    return `<div class="stage-inner">
      <div class="play-top">
        ${timerHTML()}
        <div class="tally">${fin ? `<b>1</b><span>to win</span>` : `<b>${got}</b><span>correct</span>`}</div>
      </div>
      <div class="card-stack">
        <div class="card cat-${cc} ${tr.paused ? 'paused' : ''}">
          <div class="card-band"><span>${fin ? 'Final · ' : tr.cat === 'any' ? '♠ Any · ' : ''}${CAT[cc]}${tr.card && tr.card.hard && !tr.paused ? ' · ★ Hard' : ''}</span><span>${esc(S.teams[S.cur].name)}</span></div>
          <div class="card-word" dir="auto">${tr.paused ? 'Paused' : esc(tr.card.word)}</div>
        </div>
      </div>
      <div class="parked">
        ${tr.parked
          ? `<span>Skipped: <b>${tr.paused ? '•••' : esc(tr.parked.word)}</b></span><span class="kbd-hint">Go back any time. This card waits here instead.</span>`
          : `<span class="kbd-hint">${tr.skipUsed ? 'Skip used this turn.' : 'You have 1 skip this turn.'}</span>`}
      </div>
      <div class="play-actions">
        ${tr.parked
          ? `<button class="btn btn-skip" data-act="useParked" ${tr.paused ? 'disabled' : ''}>↩ Back to skipped</button>`
          : `<button class="btn btn-skip" data-act="skip" ${tr.skipUsed || tr.paused ? 'disabled' : ''}>${tr.skipUsed ? 'Skip used' : 'Skip'}</button>`}
        <button class="btn btn-go" data-act="got" ${tr.paused ? 'disabled' : ''}>Got it ✓</button>
      </div>
      <div class="play-foot">
        <button class="link" data-act="foul" ${tr.paused ? 'disabled' : ''}>🚩 Foul called? Lose this card</button>
        <button class="link" data-act="pause">${tr.paused ? 'Resume' : 'Pause'}</button>
      </div>
      <p class="kbd-hint">Keyboard: Space = got it · S = skip · B = back to skipped</p>
    </div>`;
  },
  review() {
    const tr = S.turn, t = S.teams[S.cur], n = tr.records.filter(r => r.ok).length, fin = tr.mode === 'final';
    const to = Math.min(S.len - 1, t.pos + n), vt = S.vote;
    const pending = !!vt || tr.records.some(r => r.status === 'challenged');
    const tag = r => r.status === 'challenged' ? '🚩 Challenged' : r.status === 'upheld' ? `🚩 Foul upheld${r.tally ? ' (' + r.tally + ')' : ''}`
      : r.status === 'fair' ? `✓ Challenge rejected${r.tally ? ' (' + r.tally + ')' : ''}` : r.ok ? '✓ Correct' : r.res === 'correct' ? 'Not counted' : RES_LABEL[r.res];
    const acts = (r, i) => vt ? '' : r.status === 'challenged'
      ? `<div class="rv-actions"><button class="btn btn-foul" data-act="acceptFoul" data-i="${i}">Fair call, remove it</button><button class="btn" data-act="dispute" data-i="${i}">Dispute: vote on it</button></div>`
      : r.ok && !r.status ? `<div class="rv-actions"><button class="btn" data-act="challenge" data-i="${i}">🚩 Challenge</button></div>` : '';
    const voteBox = vt ? `<div class="vote-box">
        <p class="eyebrow">Vote</p>
        <h3>Did they say "${esc(tr.records[vt.i].word)}" or part of it?</h3>
        <p class="sub">Everyone except the describer puts a hand up for Foul or Fair. Count the hands. More foul votes removes the card. A tie means it counts.</p>
        <div class="vote-row">${[['foul', '🚩 Foul'], ['fair', '✓ Fair']].map(([k, l]) => `<div class="counter"><span>${l}</span><div>
          <button class="btn" data-act="voteCount" data-k="${k}" data-n="-1" aria-label="One fewer ${k} vote" ${vt[k] ? '' : 'disabled'}>−</button><b>${vt[k]}</b>
          <button class="btn" data-act="voteCount" data-k="${k}" data-n="1" aria-label="One more ${k} vote">+</button></div></div>`).join('')}</div>
        <div class="row"><button class="btn btn-ghost" data-act="cancelVote">Back</button><button class="btn btn-go grow" data-act="settleVote">Settle the vote (${vt.foul}–${vt.fair})</button></div>
      </div>` : '';
    const line = fin ? (n ? `${esc(t.name)} win unless a challenge holds up.` : 'The card was ruled a foul.')
      : `Move forward <b>${n}</b> ${n === 1 ? 'space' : 'spaces'}${n === 0 ? '' : to === S.len - 1 ? ' — to the finish!' : S.spaces[to].spade ? ' — onto a spade (any category next turn)!' : S.spaces[to].spin ? ' — onto a spinner!' : ''}`;
    const label = pending ? 'Settle the challenge first' : fin ? (n ? 'Confirm the win' : 'End turn') : n ? `Move ${esc(t.name)}` : 'End turn';
    return `<div class="stage-inner">
      <p class="eyebrow">${esc(t.name)}${fin ? ' · final challenge' : ''}</p>
      <h2>${fin ? 'They got it!' : "Time's up!"}</h2>
      <p class="sub">${fin ? 'Other teams: did the describer say the word? Challenge it now, before the win counts.' : 'Check the cards. Tap one to change it, for example if the team shouted the answer right on the buzzer. Other teams can challenge any card that counted.'}</p>
      ${voteBox}
      <ul class="review-list">${tr.records.map((r, i) => `
        <li class="rv-item"><button class="rv ${r.ok ? 'ok' : ''} ${r.status === 'challenged' || r.status === 'upheld' ? 'flag' : ''}" data-act="toggle" data-i="${i}" aria-pressed="${r.ok}" ${r.status || vt ? 'disabled' : ''}>
          <span class="rv-word">${esc(r.word)}</span><span class="rv-tag">${tag(r)}</span>
        </button>${acts(r, i)}</li>`).join('')}
      </ul>
      <p class="move-line">${line}</p>
      <button class="btn btn-go btn-lg" data-act="confirmMove" ${pending ? 'disabled' : ''}>${label}</button>
    </div>`;
  },
  spin() {
    const sp = S.spinner, by = S.teams[sp.by];
    const spun = sp.result != null, done = wheelDone(sp), n = spun ? Math.abs(sp.result) : 0, fwd = spun && sp.result > 0;
    return `<div class="stage-inner">
      <p class="eyebrow">Spinner space</p>
      <h2>${esc(by.name)} landed on a spinner!</h2>
      <p class="sub">${!spun ? `Spin for +1, +2, −1 or −2. Then ${esc(by.name)} choose any team to move: their own or another team.` : !done ? 'Spinning…' : `${fwd ? 'Forward' : 'Back'} ${n}! ${esc(by.name)}, pick the team to move.`}</p>
      ${wheelSVG()}
      ${done ? `<div class="spin-result">${fwd ? '+' : '−'}${n}</div>` : ''}
      ${!spun ? `<button class="btn btn-go btn-lg" data-act="spin">${esc(by.name)}, spin!</button>` : ''}
      ${done ? `<div class="spin-grid">${S.teams.map((t, i) => {
        const to = Math.max(0, Math.min(S.len - 1, t.pos + sp.result));
        return `<button class="btn spin-btn" style="--team:${t.color}" data-act="spinPick" data-i="${i}"><b>${fwd ? 'Move' : 'Send back'} ${esc(t.name)}${i === sp.by ? ' (their own team)' : ''}</b><span>${to === t.pos ? `Can't move from ${posLabel(t.pos)}` : `${cap(posLabel(t.pos))} → ${posLabel(to)}`}</span></button>`;
      }).join('')}</div>` : ''}
    </div>`;
  },
  'final-choose'() {
    const t = S.teams[S.cur];
    return `<div class="stage-inner">
      <p class="eyebrow">Final challenge</p>
      <h2>${esc(t.name)} reached the finish</h2>
      <p class="sub">To win, they need 1 right answer in 30 seconds. <b>The other teams</b> choose the category. Pick the one you think is hardest for them.</p>
      <div class="cat-grid">${ORDER.map(c => `<button class="btn cat-btn cat-${c}" data-act="finalCat" data-cat="${c}"><b>${CAT[c]}</b><span>${HINT[c]}</span></button>`).join('')}</div>
      <button class="btn btn-ghost" data-act="cancelReady">Back</button>
    </div>`;
  },
  'final-fail'() {
    const t = S.teams[S.cur];
    return `<div class="stage-inner">
      <p class="eyebrow">Final challenge</p>
      <h2>Not this time</h2>
      <p class="sub">${esc(t.name)} didn't get the card. They stay on the finish and try again next turn, with a new category picked by the other teams.</p>
      <button class="btn btn-go btn-lg" data-act="cont">Next team</button>
    </div>`;
  },
  win() {
    const t = S.teams[S.winner];
    return `<div class="stage-inner" style="text-align:center;align-items:center">
      <div class="spade-big" aria-hidden="true">♠</div>
      <p class="eyebrow">Winners</p>
      <h2 class="win-name" style="--team:${t.color}">${esc(t.name)}</h2>
      <p class="sub">They made it round the ring and nailed the final card.</p>
      ${awardsHTML(S.log, S.teams)}
      <div class="row" style="justify-content:center">
        <button class="btn btn-go btn-lg" data-act="rematch">Rematch, same teams</button>
        <button class="btn btn-ghost btn-lg" data-act="setupAgain">New setup</button>
      </div>
    </div>`;
  }
};

function renderStage() {
  const st = $('#stage'), ph = S && S.phase;
  if (ph !== 'spin' && wa.iv) { clearInterval(wa.iv); wa.iv = 0; wa.id = null; }
  if (!S || !STAGE[ph]) { st.hidden = true; st.innerHTML = ''; document.body.classList.remove('locked'); return; }
  st.hidden = false; document.body.classList.add('locked');
  st.innerHTML = STAGE[ph]();
  if (ph === 'play') paintTimer(S.turn.left);
  if (ph === 'spin') driveWheel(S.spinner);
  if (document.activeElement && document.activeElement !== document.body && !st.contains(document.activeElement)) document.activeElement.blur();
}

function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['var(--c-object)', 'var(--c-action)', 'var(--c-world)', 'var(--c-person)', 'var(--c-random)', 'var(--c-nature)'];
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = cols[i % 6];
    p.style.animationDuration = (2.2 + Math.random() * 2) + 's';
    p.style.animationDelay = (Math.random() * .8) + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 5500);
}

/* ---------- rules ---------- */
function openRules() {
  $('#rules').innerHTML = `<div class="modal-panel">
    <div class="modal-head"><h2 id="rulesTitle">How to play</h2><button class="btn btn-small" data-act="closeRules">Close</button></div>
    <section><h3>Turns</h3><ol>
      <li>Teams take turns. Each turn, one player is the describer. Swap describer every turn.</li>
      <li>The describer has 30 seconds to describe as many words as they can from the category of the space their team is on.</li>
      <li>Teammates shout guesses. Tap <b>Got it</b> for each right answer.</li>
      <li>When time's up, your team moves forward one space for every right answer.</li>
    </ol></section>
    <section><h3>The describer can't</h3><ul>
      <li>Say the word, or any part of it ("foot" for "football").</li>
      <li>Say "sounds like" or "rhymes with".</li>
      <li>Give the first letter or spell it out, or use another language.</li>
      <li>Act, mime or point. Words only.</li>
    </ul><p class="muted">Break a rule and that card is lost: tap "Foul called".</p></section>
    <section><h3>Skips</h3><p>You get <b>1 skip per turn</b>. The skipped card waits on the side, and you can go back to it any time in that turn, even after getting other cards right. Tap <b>↩ Back to skipped</b> and the card you were on waits on the side instead, so you never lose it. Whatever card is still on the side when time runs out doesn't count.</p></section>
    <section><h3>Fouls and challenges 🚩</h3><ul>
      <li>The other teams watch the screen, so they can see the word. If the describer says it or part of it, they shout "Foul!" and the describer taps <b>Foul called</b> to lose that card.</li>
      <li>After the turn, the other teams can tap <b>Challenge</b> on any card that was counted.</li>
      <li>The describing team either accepts (the card doesn't count) or disputes it. A dispute goes to a show of hands: everyone except the describer votes Foul or Fair. If more people vote foul, the card doesn't count. A tie means it counts.</li>
      <li>The final card can be challenged too, before the win counts.</li>
    </ul></section>
    <section><h3>Spades ♠</h3><p>A spade space has no single category. When your turn starts on one, every card can come from any category. It's a normal turn, not an extra go.</p></section>
    <section><h3>Word level</h3><p><b>Normal</b>: everyday words, with a harder one now and then (marked ★ Hard). <b>Hard</b>: harder words, with an everyday one now and then. <b>Hardest</b>: the toughest words, with some hard ones mixed in. Action words are always one word. <b>عربي Arabic</b>: every card is in Arabic, with places, food and famous people from across the Arab world.</p></section>
    <section><h3>Spinners</h3><p>End your turn on a spinner space (the red and green circle) and your team spins the wheel: +1, +2, −1 or −2. Then you choose any team to move by that amount: your own team, or a team you want to slow down. Moving because of the spinner doesn't set off another spade or spinner.</p></section>
    <section><h3>Winning</h3><p>Reaching the finish isn't enough. On your next turn, the other teams choose a category and you must get 1 card right before the time runs out. Miss it and you try again next turn. The first team to pass the final challenge wins.</p></section>
    <section><h3>Play offline</h3><p>Open <b>libyan11.github.io/spade-and-speak/play</b> on your phone once while you have internet, then choose <b>Add to Home Screen</b> (the Share menu on iPhone, the ⋮ menu on Android). After that it opens and plays with no internet.</p></section>
    <section><h3>Categories</h3><div class="cat-table">${ORDER.map(c => `<div><span class="pill cat-${c}">${CAT[c]}</span>${HINT[c]}</div>`).join('')}</div></section>
  </div>`;
  $('#rules').hidden = false;
  $('#rules [data-act="closeRules"]').focus();
}
function closeRules() { $('#rules').hidden = true; $('#rulesBtn').focus(); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'rules') { closeRules(); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b);
});
document.addEventListener('input', e => {
  if (e.target.id && /^t(name|players)\d$/.test(e.target.id)) { readDraftInputs(); store(DRAFT_KEY, draft); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#rules').hidden) { closeRules(); return; }
  if (!S || e.target.closest('input, textarea') || !$('#rules').hidden) return;
  if (S.phase === 'play') {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') { e.preventDefault(); ACT.got(); }
    else if (k === 's') ACT.skip();
    else if (k === 'b') ACT.useParked();
    else if (k === 'p') ACT.pause();
  }
});

/* ---------- boot ---------- */
function freshDraft() { return { count: 2, len: 25, words: 'normal', teams: DEFAULT_NAMES.map(name => ({ name, players: '' })) }; }
function boot(data) {
  data = data || {};
  draft = data.draft || fetchStore(DRAFT_KEY) || freshDraft();
  if (!Array.isArray(draft.teams) || draft.teams.length < 6) draft = freshDraft();
  if (!BOARD_SIZES.some(([n]) => n === draft.len)) draft.len = 25;   // drafts saved with the old 30/40/50 sizes
  if (data.S) { S = data.S; normalize(); }
  else {
    const g = fetchStore(SAVE_KEY);
    if (g && g.phase !== 'win' && Array.isArray(g.teams)) saved = g;
  }
  render();
}
try { window.claude?.hot?.snapshot?.(() => { readDraftInputs(); return { S, draft }; }); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
<script>
/* offline: keep a copy of the game on the phone */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
